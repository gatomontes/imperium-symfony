name: O3-B1 correction reviewer regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run unchanged independent R1 regression
        run: vendor/bin/phpunit tests/Imperium/Runtime/AugurReviewerMappingLimitsTest.php
      - name: Run correction mapping boundaries and currentness
        run: vendor/bin/phpunit tests/Imperium/Runtime --filter 'AugurMapping(Limits|Currentness)Test'
