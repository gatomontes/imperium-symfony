name: O4 V2 diagnostic validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Check exact source identity
        run: git log -1 --format=%H
      - name: Run pure computation and custody regressions
        run: vendor/bin/phpunit tests/Imperium/Runtime/JournalFieldParsingCompatibilityTest.php tests/Imperium/Runtime/JournalFieldEncodingCompatibilityTest.php tests/Imperium/Runtime/CustodyPureScopeTest.php tests/Imperium/Runtime/ProviderOnboardingCustodyTest.php tests/Imperium/Runtime/PureReferenceKeyCompatibilityTest.php tests/Imperium/Runtime/PureIndexComparisonCompatibilityTest.php tests/Imperium/Runtime/OnboardingParseScopeTest.php tests/Imperium/Runtime/StrictJsonScannerCompatibilityTest.php tests/Imperium/Runtime/CanonicalTraversalCompatibilityTest.php tests/Imperium/Runtime/JournalReviewerFreshReadTest.php
