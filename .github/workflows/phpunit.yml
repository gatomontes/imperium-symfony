name: PHPUnit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        partition: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run O3-B0 reviewer credential binding regression
        run: vendor/bin/phpunit tests/Imperium/Runtime/DeepSeekReviewerCredentialBindingTest.php
      - name: Run assigned test files
        run: python3 tools/ci/phpunit_partitions.py run ${{ matrix.partition }} 8 "$RUNNER_TEMP/phpunit-results"
      - name: Preserve partition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpunit-${{ matrix.partition }}
          path: ${{ runner.temp }}/phpunit-results/
          if-no-files-found: error
          retention-days: 30
  test:
    name: test
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every partition to succeed
        env:
          SUITE_RESULT: ${{ needs.suite.result }}
        run: test "$SUITE_RESULT" = success
      - uses: actions/checkout@v4
      - name: Check coverage guard fault handling
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - uses: actions/download-artifact@v4
        with:
          pattern: phpunit-*
          path: ${{ runner.temp }}/phpunit-evidence
      - name: Require exact complete-suite coverage and consistent source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/phpunit_partitions.py verify "$RUNNER_TEMP/phpunit-evidence" 8 "$(git rev-parse 'HEAD^{tree}')" | tee "$RUNNER_TEMP/coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: phpunit-complete-coverage
          path: ${{ runner.temp }}/coverage.json
          if-no-files-found: error
          retention-days: 30
