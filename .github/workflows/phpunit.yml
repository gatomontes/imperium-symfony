name: O4 R1 independent consumer validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case:
          - testForeignSettingsAndUnassessedProfileCannotReachActualFormationTransport
          - testRealOwnerOrdinaryAndCustodiedExecutionExactConfigurationRecoveryAndNegatives
          - testSameAggregateForeignInstanceRefusesBothRoutes
          - testCustodyRechecksCurrentSettingsAfterCredentialConsumptionBoundary
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run unchanged consumer case on exact candidate production source
        run: vendor/bin/phpunit --filter "${{ matrix.case }}" tests/Imperium/Runtime
