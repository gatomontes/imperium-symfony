name: O4 JSON correction independent validation
on:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        selection:
          - 'StrictJsonScannerCompatibilityTest|CanonicalTraversalCompatibilityTest|OnboardingParseScopeTest'
          - 'testForeignSettingsAndUnassessedProfileCannotReachActualFormationTransport'
          - 'testRealOwnerOrdinaryAndCustodiedExecutionExactConfigurationRecoveryAndNegatives'
          - 'testSameAggregateForeignInstanceRefusesBothRoutes'
          - 'testCustodyRechecksCurrentSettingsAfterCredentialConsumptionBoundary'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run unchanged differential and R1 regressions
        run: vendor/bin/phpunit --filter "${{ matrix.selection }}" tests/Imperium/Runtime
