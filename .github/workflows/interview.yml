name: Seneschal interview and proposal

on:
    push:
        branches: [main, codex/seneschal-cli-interview, codex/seneschal-proposal, codex/proposal-review-approval]
    pull_request:

permissions:
    contents: read

jobs:
    postgres:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: app_test
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            APP_ENV: test
            DATABASE_URL: 'postgresql://app:test_password@127.0.0.1:5432/app?serverVersion=16&charset=utf8'
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
              with:
                  php-version: '8.4'
                  extensions: pdo_pgsql, intl, mbstring, dom, xml, fileinfo
                  coverage: none
                  tools: composer:v2
            - run: composer install --no-interaction --prefer-dist
            - run: composer validate --no-check-publish
            - run: php bin/console lint:container
            - run: php bin/console lint:yaml config .github/workflows
            - run: php bin/console doctrine:migrations:migrate --no-interaction
            - run: php bin/console doctrine:schema:validate
            - run: php bin/phpunit
            - name: Check migration rollback and reapply on the disposable test database
              run: |
                  php bin/console doctrine:migrations:execute 'DoctrineMigrations\Version20260925190000' --down --no-interaction
                  php bin/console doctrine:migrations:execute 'DoctrineMigrations\Version20260925173000' --down --no-interaction
                  php bin/console doctrine:migrations:execute 'DoctrineMigrations\Version20260925152000' --down --no-interaction
                  php bin/console doctrine:migrations:execute 'DoctrineMigrations\Version20260924222000' --down --no-interaction
                  php bin/console doctrine:migrations:migrate --no-interaction
                  php bin/console doctrine:schema:validate
