# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Symfony\AI\Platform\Bridge\Generic\ModelCatalog:
        arguments:
            $models:
                deepseek-v4-flash:
                    class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
                    capabilities:
                        - !php/const 'Symfony\AI\Platform\Capability::INPUT_MESSAGES'
                        - !php/const 'Symfony\AI\Platform\Capability::OUTPUT_TEXT'
                        - !php/const 'Symfony\AI\Platform\Capability::OUTPUT_STREAMING'
                        - !php/const 'Symfony\AI\Platform\Capability::OUTPUT_STRUCTURED'

    App\:
        resource: '../src/'
        exclude:
            - '../src/ProtectedMission/'
            - '../src/Imperium/Runtime/ProviderTransition/'
            - '../src/ReproofV2/'
            - '../src/IndependentVerification/ReproofV2*'
            - '../src/Command/SortieRunCommand.php'
            - '../src/Imperium/Runtime/Sortie/SymfonyAiSortieCognitionGateway.php'
            - '../src/Imperium/Runtime/Sortie/HttpGetSortieToolExecutor.php'
            - '../src/Imperium/Runtime/Sortie/GovernedSortieToolRegistry.php'
            - '../src/Imperium/Runtime/Imperator/ProviderBindingSuccessorAtomicLiveTransitionAdversarialAuditService.php'
            - '../src/Imperium/Runtime/Imperator/AtomicTransitionEvidenceCorrectedClosureService.php'
            - '../src/Imperium/Runtime/Imperator/AtomicTransitionEvidenceTerminalAdversarialAuditor.php'
            - '../src/IndependentVerification/AtomicTransitionIndependentVerificationAdmissionConsumer.php'

    App\Imperium\Runtime\ProviderTransition\NativeState:
        arguments:
            $root: '%kernel.project_dir%'

    App\Imperium\Runtime\ProviderTransition\NativeBindingReader: ~

    App\Imperium\Runtime\Persistence\RecordReferenceValidator:
        arguments:
            $legacyBinding: null

    App\Bootstrap\ManifestValidator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Bootstrap\StateStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Cognition\GovernanceCognitionAuthorityRegistry:
        arguments:
            $resolvers:
                - '@App\Imperium\Runtime\Foundry\FoundryGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Authorship\AuthorshipGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Authorship\SectionAuthorshipGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Laboratorium\LaboratoriumGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Guildhall\GuildhallGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Curia\CurianGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Senate\SenateProfileExaminationGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Senate\SenatePersonaConfirmationQuestionGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Senate\SenatePersonaFreshConsistencyQuestionGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Senate\SenatePersonaFreshConsistencyTestimonyGovernanceCognitionAuthorityResolver'
                - '@App\Imperium\Runtime\Senate\SenatePersonaGovernancePressureQuestionGovernanceCognitionAuthorityResolver'
