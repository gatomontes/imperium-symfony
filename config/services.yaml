# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Symfony\AI\Platform\Bridge\Generic\ModelCatalog:
        arguments:
            $models:
                deepseek-v4-flash:
                    class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
                    capabilities:
                        - !php/const 'Symfony\AI\Platform\Capability::INPUT_MESSAGES'
                        - !php/const 'Symfony\AI\Platform\Capability::OUTPUT_TEXT'
                        - !php/const 'Symfony\AI\Platform\Capability::OUTPUT_STREAMING'
                        - !php/const 'Symfony\AI\Platform\Capability::OUTPUT_STRUCTURED'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Command/SortieRunCommand.php'
            - '../src/Imperium/Runtime/Sortie/SymfonyAiSortieCognitionGateway.php'
            - '../src/Imperium/Runtime/Sortie/HttpGetSortieToolExecutor.php'
            - '../src/Imperium/Runtime/Sortie/GovernedSortieToolRegistry.php'

    App\Bootstrap\ManifestValidator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Bootstrap\StateStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Curia\ProceedingStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Curia\PlanningCommissionRouter:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Curia\ConstructionAuthorizationRequestService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Curia\ConstructionAuthorizationDecisionService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Curia\ConstructionAuthorizationDeliveryService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Foundry\FoundryActivationDemandService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\GuildhallActivationDemandService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\ProfileDefinitionRegistry:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\GuildhallProvisioningCaseService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\CanonicalGuildhallStaffRegistry:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\GuildhallSummonsService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Conscription\GenericOfficerSubstrateRegistry:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Conscription\GuildhallConscriptionService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Conscription\ConstableConscriptionService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\GuildhallSeatBindingService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\GuildhallCommissionAcceptanceService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\SymfonyAiGuildhallCognitionGateway:
        arguments:
            $disciplinaryFit: '@ai.agent.guildhall_disciplinary_fit'
            $composition: '@ai.agent.guildhall_composition'
            $boundaryChallenge: '@ai.agent.guildhall_boundary_challenge'
            $guildmaster: '@ai.agent.guildmaster'

    App\Imperium\Runtime\Guildhall\GuildhallCognitionGateway:
        alias: App\Imperium\Runtime\Guildhall\SymfonyAiGuildhallCognitionGateway

    App\Imperium\Runtime\Guildhall\GuildhallDeliberationService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\GuildhallPersonnelDispositionService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Garrison\GarrisonInventoryInquiryService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Garrison\GarrisonInventoryResponseService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Garrison\CanonicalConstableRegistry:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Garrison\ConstableProvisioningService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Garrison\ConstableConstructionCommissionService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Garrison\ConstableSeatBindingService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Curia\SymfonyAiSeneschalCognitionGateway:
        arguments:
            $agent: '@ai.agent.seneschal'

    App\Imperium\Runtime\Curia\SeneschalCognitionGateway:
        alias: App\Imperium\Runtime\Curia\SymfonyAiSeneschalCognitionGateway

    App\Imperium\Runtime\LaCortine\SortieProcessLauncher:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\LaCortine\InboundArtifactStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\LaCortine\AgentMailWebhookVerifier:
        arguments:
            $signingSecret: '%env(AGENTMAIL_WEBHOOK_SECRET)%'

    App\Imperium\Runtime\LaCortine\CredentialBroker:
        alias: App\Imperium\Runtime\LaCortine\EnvironmentCredentialBroker

    App\Imperium\Runtime\Sortie\SortieCognitionGateway:
        alias: App\Imperium\Runtime\Sortie\UnavailableSortieCognitionGateway
