        autowire: true
        autoconfigure: true

    Symfony\AI\Platform\Bridge\Generic\ModelCatalog:
        arguments:
            $models:
                deepseek-v4-flash:
                    class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
