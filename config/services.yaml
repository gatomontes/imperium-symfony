# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Symfony\AI\Platform\Bridge\Generic\ModelCatalog:
        arguments:
            $models:
                deepseek-v4-flash:
                    class: 'Symfony\AI\Platform\Bridge\Generic\CompletionsModel'
                    capabilities:
                        - !php/const 'Symfony\AI\Platform\Capability::INPUT_MESSAGES'
                        - !php/const 'Symfony\AI\Platform\Capability::OUTPUT_TEXT'
                        - !php/const 'Symfony\AI\Platform\Capability::OUTPUT_STREAMING'
                        - !php/const 'Symfony\AI\Platform\Capability::OUTPUT_STRUCTURED'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Command/SortieRunCommand.php'
            - '../src/Imperium/Runtime/Sortie/SymfonyAiSortieCognitionGateway.php'
            - '../src/Imperium/Runtime/Sortie/HttpGetSortieToolExecutor.php'
            - '../src/Imperium/Runtime/Sortie/GovernedSortieToolRegistry.php'

    App\Bootstrap\ManifestValidator:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Bootstrap\StateStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Curia\ProceedingStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Curia\PlanningCommissionRouter:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\GuildhallActivationDemandService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Guildhall\ProfileDefinitionRegistry:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\Curia\SymfonyAiSeneschalCognitionGateway:
        arguments:
            $agent: '@ai.agent.seneschal'

    App\Imperium\Runtime\Curia\SeneschalCognitionGateway:
        alias: App\Imperium\Runtime\Curia\SymfonyAiSeneschalCognitionGateway

    App\Imperium\Runtime\LaCortine\SortieProcessLauncher:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\LaCortine\InboundArtifactStore:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Imperium\Runtime\LaCortine\AgentMailWebhookVerifier:
        arguments:
            $signingSecret: '%env(AGENTMAIL_WEBHOOK_SECRET)%'

    App\Imperium\Runtime\LaCortine\CredentialBroker:
        alias: App\Imperium\Runtime\LaCortine\EnvironmentCredentialBroker

    App\Imperium\Runtime\Sortie\SortieCognitionGateway:
        alias: App\Imperium\Runtime\Sortie\UnavailableSortieCognitionGateway
