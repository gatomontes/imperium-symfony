ai:
    platform:
        openai:
            api_key: '%env(OPENAI_API_KEY)%'
            http_client: seneschal.client

    agent:
        seneschal:
            platform: ai.platform.openai
            model: '%env(IMPERIUM_OPENAI_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/seneschal.txt'
            tools: false

when@test:
    ai:
        platform:
            openai:
                http_client: seneschal.test_client
