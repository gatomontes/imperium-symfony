ai:
    platform:
        deepseek:
            api_key: '%env(DEEPSEEK_API_KEY)%'
            http_client: seneschal.client

    # The installed bridge predates the current Flash model name.
    model:
        deepseek:
            deepseek-flash:
                class: Symfony\AI\Platform\Bridge\DeepSeek\DeepSeek
                capabilities: ['input-messages', 'output-text']

    agent:
        seneschal:
            platform: ai.platform.deepseek
            model: '%env(IMPERIUM_DEEPSEEK_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/seneschal.txt'
            tools: false
        proposal_drafter:
            platform: ai.platform.deepseek
            model: '%env(IMPERIUM_DEEPSEEK_MODEL)%'
            prompt:
                file: '%kernel.project_dir%/config/prompts/proposal-drafter.txt'
            tools: false

when@test:
    ai:
        platform:
            deepseek:
                http_client: seneschal.test_client
